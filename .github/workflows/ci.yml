name: CI

# Runs on every PR and on pushes to main. Proves the tree is sound
# (TypeScript build, syntax, tests, types), audits dependencies, and confirms
# still packages on all three target operating systems.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Only the newest run per ref matters; cancel superseded in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more only where they need it.
permissions:
  contents: read

jobs:
  quality:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.0", "24"]
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run verification
        run: npm run verify
      - name: Audit locked dependencies
        if: matrix.node == '24'
        run: npm audit --audit-level=high
      - name: Check audio scheduler budget
        run: npm run benchmark:audio

  dependency-review:
    name: Dependency review
    # Only meaningful on PRs — it diffs the base ref against the head ref.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  build:
    name: Build test on ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            build-cmd: npm run package:win
            artifact-name: mechvibes-windows-x64
            artifact-path: dist/**/*.exe
          - os: macos-latest
            build-cmd: npm run package:mac
            artifact-name: mechvibes-macos-x64
            artifact-path: dist/**/*.dmg
          - os: ubuntu-latest
            build-cmd: npm run package:linux
            artifact-name: mechvibes-linux-x64
            artifact-path: |
              dist/**/*.deb
              dist/**/*.AppImage
              dist/**/*.snap
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install native X11 and build-essential header libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxext-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev libxinerama-dev libxi-dev libxt-dev
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run verification
        run: npm run verify
      - name: Cache Electron and packaging downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: packaging-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: packaging-${{ runner.os }}-
      - name: Cache pinned Windows prerequisite
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v5
        with:
          path: build/vendor/vc_redist.x64.exe
          key: vcredist-x64-${{ hashFiles('build/windows-runtime.json') }}
      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          if ! ${{ matrix.build-cmd }} 2>&1 | tee package-build.log; then
            details=$(tail -c 6000 package-build.log)
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Packaging failed::$details"
            exit 1
          fi
      - name: Smoke-test Windows install, reinstall and uninstall
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./tools/smoke-nsis.ps1

      - name: Generate verified release metadata
        run: npm run release:metadata -- dist
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-path }}
            dist/SHA256SUMS.txt
            dist/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
