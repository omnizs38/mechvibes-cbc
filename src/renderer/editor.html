<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>Mechvibes — Editor</title>
    <!--
      The window is loaded from disk (file://), which gives the document an
      opaque origin. 'self' does not match anything under that scheme, so the
      file: source is required or the bundled scripts are refused and the
      window stays blank.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file: data: blob:; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: data: blob:; font-src 'self' file: data:; media-src 'self' file: data: blob:; connect-src 'self' file: data: blob: https:;"
    />
    <link rel="shortcut icon" type="image/png" href="../assets/icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./editor/main.tsx"></script>
  </body>
</html>
